name: CNTE-VSL scientific tests
on:
  push:
    branches: [feature/cnte-virtual-science-labs]
    paths:
      - 'cnte-vsl/**'
      - '.github/workflows/cnte-vsl-checks.yml'
  pull_request:
    paths:
      - 'cnte-vsl/**'
      - '.github/workflows/cnte-vsl-checks.yml'
jobs:
  scientific-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cnte-vsl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run scientific model tests
        run: npm test
      - name: Validate JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/science.js
          node --check src/scene3d.js

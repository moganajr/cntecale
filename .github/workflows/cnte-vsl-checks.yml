name: CNTE-VSL scientific tests
on:
  push:
    branches: [feature/cnte-virtual-science-labs]
    paths:
      - 'cnte-vsl/**'
      - '.github/workflows/cnte-vsl-checks.yml'
  pull_request:
    paths:
      - 'cnte-vsl/**'
      - '.github/workflows/cnte-vsl-checks.yml'
jobs:
  scientific-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cnte-vsl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development live-service dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Run scientific and live-state regression tests
        run: npm test
      - name: Verify HTTP and WebSocket lecturer/student collaboration
        run: npm run test:integration
      - name: Validate JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/science.js
          node --check src/scene3d.js
          node --check src/titrationPractical.js
          node --check src/physicsCircuit.js
          node --check src/physicsWorkbench.js
          node --check src/physics3d.js
          node --check src/biologyMicroscopy.js
          node --check src/biologyWorkbench.js
          node --check src/biology3d.js
          node --check src/medicalLab.js
          node --check src/medicalWorkbench.js
          node --check src/tvetFaults.js
          node --check src/tvetWorkbench.js
          node --check src/liveEngine.js
          node --check src/classroomCore.js
          node --check tests/classroomCore.test.mjs
          node --check src/live.js
          node --check src/equipmentEngine.js
          node --check src/equipmentWorkshop.js
          node --check src/serviceMechanics.js
          node --check src/spatialAssembly.js
          node --check src/physicalConstraints.js
          node --check src/medicalProcedure.js
          node --check src/medicalLivePanel.js
          node --check tests/medicalProcedure.test.mjs
          node --check src/diagnosticMicroscopy.js
          node --check src/microscopyLivePanel.js
          node --check tests/diagnosticMicroscopy.test.mjs
          node --check tests/physical.test.mjs
          node --check tests/spatial.test.mjs
          node --check src/serviceLive.js
          node --check tests/service.test.mjs
          node --check tests/equipment.test.mjs
          node --check live-server/server.js
          node --check tests/live.test.mjs
          node --check tests/live-integration.test.mjs
